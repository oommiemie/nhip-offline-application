name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# ปล่อย deploy ทีละรอบ รอบใหม่มาระหว่างรอบเก่ายังไม่จบให้ยกเลิกตัวเก่า
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: ติดตั้ง dependencies
        run: npm ci

      - name: ตรวจชนิดข้อมูล
        run: npx tsc --noEmit

      - name: Export เว็บเป็น static
        run: npx expo export -p web

      - name: เตรียมไฟล์ให้ GitHub Pages
        # .nojekyll — Expo สร้างโฟลเดอร์ _expo/ ซึ่ง Jekyll จะกินทิ้งถ้าไม่มีไฟล์นี้
        # 404.html — เผื่อเปิด URL ตรง ๆ ให้ตกกลับมาที่แอป (แอปใช้ hash routing)
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
